<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1.0"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="/css/theme.css"/><script src="/js/theme.js"></script><title>Page Not Found — SkyVayu</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"><style>:root{--navy:#0c1324;--gold:#C9A84C;--white:#FFFFFF;--white-60:rgba(255,255,255,0.60);--white-30:rgba(255,255,255,0.30);--white-20:rgba(255,255,255,0.20);--white-10:rgba(255,255,255,0.10);--font-display:'Cormorant Garamond',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;--font-mono:'Space Mono','Courier New',monospace;}body{background:var(--navy);color:var(--white);font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column}.page-nav{display:flex;align-items:center;justify-content:space-between;padding:20px 48px;border-bottom:1px solid var(--white-10)}.nav-logo{font-family:var(--font-display);font-size:22px;color:var(--gold);text-decoration:none;letter-spacing:.02em}.error-body{flex:1;display:flex;align-items:center;justify-content:center;padding:48px}.error-inner{text-align:center;max-width:480px}.error-code{font-family:var(--font-mono);font-size:120px;font-weight:500;color:var(--white-10);line-height:1;letter-spacing:-4px;margin-bottom:0}.error-title{font-family:var(--font-display);font-size:clamp(28px,4vw,40px);font-weight:600;margin:8px 0 16px}.error-sub{font-size:15px;color:var(--white-60);line-height:1.6;margin-bottom:40px}.error-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.btn-primary{background:var(--gold);color:var(--navy);border:none;padding:14px 28px;border-radius:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:opacity .2s}.btn-primary:hover{opacity:.85}.btn-secondary{background:transparent;color:var(--white-60);border:1px solid var(--white-20);padding:14px 28px;border-radius:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:border-color .2s,color .2s}.btn-secondary:hover{border-color:var(--gold);color:var(--gold)}footer{border-top:1px solid var(--white-10);padding:20px 48px;display:flex;justify-content:space-between;align-items:center}footer p{font-family:var(--font-mono);font-size:10px;color:var(--white-30);letter-spacing:.05em}</style></head><body><nav class="page-nav"><a href="/" class="nav-logo">SkyVayu</a></nav><div class="error-body"><div class="error-inner"><p class="error-code">404</p><h1 class="error-title">Flight Path Not Found</h1><p class="error-sub">The page you're looking for doesn't exist or may have moved. Let's get you back on course.</p><div class="error-actions"><a href="/" class="btn-primary">Back to Home</a><a href="/help" class="btn-secondary">Help Center</a></div></div></div><footer><p>© 2025 SkyVayu Aviation Pvt Ltd.</p></footer></body></html>
