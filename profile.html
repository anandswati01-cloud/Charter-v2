<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — SkyVayu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
  <style>
    :root {
      --navy: #0c1324;
      --navy-mid: #0f1a30;
      --navy-light: #162040;
      --gold: #fbbf24;
      --gold-light: #fcd34d;
      --white: #ffffff;
      --white-60: rgba(255,255,255,0.6);
      --white-30: rgba(255,255,255,0.3);
      --white-10: rgba(255,255,255,0.1);
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-mono: 'DM Mono', monospace;
      --font-body: 'DM Sans', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--navy);
      color: var(--white);
      font-family: var(--font-body);
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    a { text-decoration: none; color: inherit; }

    /* NAV */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--white-10);
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 32px;
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }
    .nav-logo {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--white);
      letter-spacing: 0.02em;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .nav-links a {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--white-60);
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--white); }
    .nav-links a.active { color: var(--white); border-bottom: 1px solid var(--gold); padding-bottom: 2px; }
    .nav-cta {
      background: var(--gold);
      color: var(--navy) !important;
      padding: 8px 20px;
      border-radius: 2px;
      font-weight: 500;
      font-size: 0.75rem !important;
      letter-spacing: 0.08em !important;
      text-transform: uppercase;
      transition: background 0.2s !important;
    }
    .nav-cta:hover { background: var(--gold-light) !important; }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .user-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 20px;
      background: var(--white-10);
      font-size: 0.8rem;
      color: var(--white);
      text-decoration: none;
      transition: background 0.2s;
    }
    .user-chip:hover { background: var(--white-30); }

    /* PROFILE PAGE */
    .profile-page {
      padding-top: 120px;
      padding-bottom: 80px;
      min-height: 100vh;
    }
    .profile-container {
      max-width: 640px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .profile-label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--white-60);
      margin-bottom: 12px;
    }
    .profile-title {
      font-family: var(--font-display);
      font-size: 3rem;
      font-weight: 500;
      color: var(--white);
      margin: 0 0 12px 0;
      line-height: 1.1;
    }
    .profile-subtitle {
      color: var(--white-60);
      font-size: 0.95rem;
      margin: 0 0 48px 0;
    }

    /* PROFILE CARD */
    .profile-card {
      background: var(--navy-mid);
      border: 1px solid var(--white-10);
      border-radius: 4px;
      padding: 40px;
    }
    .field-group {
      margin-bottom: 32px;
    }
    .field-label {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--white-60);
      margin-bottom: 8px;
    }
    .field-value {
      font-size: 1rem;
      color: var(--white);
      font-family: var(--font-mono);
      padding: 12px 0;
      border-bottom: 1px solid var(--white-10);
    }
    .field-note {
      font-size: 0.75rem;
      color: var(--white-30);
      margin-top: 6px;
    }
    .field-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--white-30);
      color: var(--white);
      font-family: var(--font-mono);
      font-size: 1rem;
      padding: 12px 0;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .field-input::placeholder { color: var(--white-30); }
    .field-input:focus { border-bottom-color: var(--gold); }

    /* SAVE BUTTON */
    .save-btn {
      background: var(--gold);
      color: var(--navy);
      border: none;
      padding: 14px 32px;
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.2s, opacity 0.2s;
      margin-top: 8px;
    }
    .save-btn:hover { background: var(--gold-light); }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* STATUS */
    .status-msg {
      margin-top: 16px;
      font-size: 0.8rem;
      color: var(--gold);
      min-height: 20px;
    }

    /* SIGN OUT */
    .signout-section {
      margin-top: 40px;
      padding-top: 32px;
      border-top: 1px solid var(--white-10);
    }
    .signout-link {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--white-30);
      cursor: pointer;
      transition: color 0.2s;
      background: none;
      border: none;
      padding: 0;
      font-family: var(--font-body);
    }
    .signout-link:hover { color: var(--white-60); }

    /* LIGHT THEME OVERRIDES */
    [data-theme="light"] body {
      background: #f9f7f4;
      color: #0c1324;
    }
    [data-theme="light"] .nav {
      background: rgba(249, 247, 244, 0.9);
      border-bottom-color: rgba(12, 19, 36, 0.1);
    }
    [data-theme="light"] .nav-logo,
    [data-theme="light"] .nav-links a { color: #0c1324; }
    [data-theme="light"] .nav-links a:hover { color: #0c1324; }
    [data-theme="light"] .user-chip { background: rgba(12,19,36,0.08); color: #0c1324; }
    [data-theme="light"] .profile-title { color: #0c1324; }
    [data-theme="light"] .profile-subtitle { color: rgba(12,19,36,0.6); }
    [data-theme="light"] .profile-label,
    [data-theme="light"] .field-label { color: rgba(12,19,36,0.5); }
    [data-theme="light"] .profile-card {
      background: #ffffff;
      border-color: rgba(12,19,36,0.1);
      box-shadow: 0 2px 16px rgba(12,19,36,0.06);
    }
    [data-theme="light"] .field-value,
    [data-theme="light"] .field-input { color: #0c1324; border-bottom-color: rgba(12,19,36,0.2); }
    [data-theme="light"] .field-input::placeholder { color: rgba(12,19,36,0.3); }
    [data-theme="light"] .field-note { color: rgba(12,19,36,0.4); }
    [data-theme="light"] .signout-section { border-top-color: rgba(12,19,36,0.1); }
    [data-theme="light"] .signout-link { color: rgba(12,19,36,0.4); }
    [data-theme="light"] .signout-link:hover { color: rgba(12,19,36,0.7); }

    #theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--white-60);
      font-size: 1.1rem;
      padding: 4px;
      transition: color 0.2s;
      line-height: 1;
    }
    #theme-toggle:hover { color: var(--white); }
    [data-theme="light"] #theme-toggle { color: rgba(12,19,36,0.5); }
    [data-theme="light"] #theme-toggle:hover { color: #0c1324; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">SkyVayu</a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/fleet">Fleet</a></li>
        <li><a href="/about">About Us</a></li>
      </ul>
      <div class="nav-right">
        <button id="theme-toggle" title="Toggle theme">☀</button>
        <a href="/profile" class="user-chip" id="user-chip" style="display:none">
          <span id="user-name-nav">My Account</span>
        </a>
        <a href="/payment" class="nav-cta" id="nav-get-quotes">GET QUOTES</a>
      </div>
    </div>
  </nav>

  <div class="profile-page">
    <div class="profile-container">
      <p class="profile-label">Account</p>
      <h1 class="profile-title">My Profile</h1>
      <p class="profile-subtitle">Your details are pre-filled when requesting quotations.</p>

      <div class="profile-card">
        <div class="field-group">
          <div class="field-label">Full Name</div>
          <div class="field-value" id="display-name">—</div>
        </div>

        <div class="field-group">
          <div class="field-label">Email Address</div>
          <div class="field-value" id="display-email">—</div>
          <div class="field-note">Email is set by your Google account and cannot be changed here.</div>
        </div>

        <div class="field-group">
          <div class="field-label">Phone Number</div>
          <input
            type="tel"
            id="phone-input"
            class="field-input"
            placeholder="+91 98765 43210"
          >
        </div>

        <button class="save-btn" id="save-btn" onclick="saveProfile()">Save Changes</button>
        <div class="status-msg" id="status-msg"></div>

        <div class="signout-section">
          <button class="signout-link" onclick="handleSignOut()">Sign out</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/theme.js"></script>
  <script>
    function showStatus(msg, isError) {
      const el = document.getElementById('status-msg');
      el.textContent = msg;
      el.style.color = isError ? '#ef4444' : 'var(--gold)';
      if (msg) setTimeout(() => { el.textContent = ''; }, 3000);
    }

    function loadProfile(user) {
      document.getElementById('display-name').textContent = user.user_metadata?.full_name || user.email?.split('@')[0] || '—';
      document.getElementById('display-email').textContent = user.email || '—';

      // Show user chip in nav
      const chip = document.getElementById('user-chip');
      const nameNav = document.getElementById('user-name-nav');
      if (chip && user.user_metadata?.full_name) {
        nameNav.textContent = user.user_metadata.full_name.split(' ')[0];
        chip.style.display = 'flex';
      }

      // Load phone from Supabase profiles table
      const sb = window._svSupabase;
      if (sb) {
        sb.from('profiles').select('phone').eq('id', user.id).single()
          .then(({ data, error }) => {
            if (data && data.phone) {
              document.getElementById('phone-input').value = data.phone;
            }
          });
      }
    }

    async function saveProfile() {
      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      showStatus('Saving…');
      const phone = document.getElementById('phone-input').value.trim();
      const sb = window._svSupabase;
      if (!sb) { showStatus('Not connected.', true); btn.disabled = false; return; }

      getSession(function(user) {
        if (!user) { showStatus('Please sign in.', true); btn.disabled = false; return; }
        sb.from('profiles').upsert({ id: user.id, phone: phone }, { onConflict: 'id' })
          .then(({ error }) => {
            btn.disabled = false;
            if (error) { showStatus('Error: ' + error.message, true); }
            else { showStatus('Saved successfully.'); }
          });
      });
    }

    function handleSignOut() {
      const sb = window._svSupabase;
      if (sb) sb.auth.signOut().then(() => { window.location.href = '/'; });
      else window.location.href = '/';
    }

    function waitForAuth() {
      const maxAttempts = 20;
      let attempts = 0;
      function check() {
        attempts++;
        if (typeof getSession === 'function') {
          getSession(function(user) {
            if (user) {
              loadProfile(user);
            } else {
              window.location.href = '/?signin=required';
            }
          });
        } else if (attempts < maxAttempts) {
          setTimeout(check, 300);
        } else {
          showStatus('Auth failed to load.', true);
        }
      }
      check();
    }

    document.addEventListener('DOMContentLoaded', waitForAuth);
  </script>
</body>
</html>
