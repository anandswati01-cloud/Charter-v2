<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — SkyVayu</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/theme.css" />
  <style>
    .profile-page {
      min-height: 100vh;
      background: var(--surface);
      padding: 48px 24px 80px;
    }
    .profile-container {
      max-width: 640px;
      margin: 0 auto;
    }
    .profile-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
    }
    .profile-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 400;
      color: var(--text);
      margin: 0 0 8px;
      line-height: 1.1;
    }
    .profile-subtitle {
      font-size: 14px;
      color: var(--text-dim);
      margin: 0 0 48px;
    }
    .profile-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 32px;
      margin-bottom: 16px;
    }
    .profile-field {
      margin-bottom: 28px;
    }
    .profile-field:last-child {
      margin-bottom: 0;
    }
    .profile-label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .profile-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      padding: 8px 0;
      font-family: var(--font-serif);
      font-size: 18px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .profile-input:focus {
      border-color: var(--gold);
    }
    .profile-input[readonly] {
      opacity: 0.6;
      cursor: default;
    }
    .profile-hint {
      font-size: 11px;
      color: var(--text-muted, var(--text-dim));
      margin-top: 6px;
      opacity: 0.7;
    }
    .profile-save-btn {
      display: inline-block;
      margin-top: 32px;
      padding: 14px 32px;
      background: var(--gold);
      color: #0c1224;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .profile-save-btn:hover { opacity: 0.85; }
    .profile-save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .profile-signout {
      display: inline-block;
      margin-top: 16px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--text-dim);
      background: none;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      padding: 0;
    }
    .profile-signout:hover { color: var(--text); }
    .profile-status {
      margin-top: 16px;
      font-size: 13px;
      min-height: 20px;
    }
    .profile-status.success { color: #4ade80; }
    .profile-status.error { color: #f87171; }
    #profile-unauthenticated {
      text-align: center;
      padding: 80px 0;
    }
    #profile-loading {
      text-align: center;
      padding: 80px 0;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-logo">SkyVayu</a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/fleet">Fleet</a></li>
      <li><a href="/about">About Us</a></li>
    </ul>
    <div class="nav-right">
      <button id="theme-toggle" onclick="toggleTheme()" title="Switch theme" aria-label="Toggle theme">
        <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <!-- user chip (shown when logged in) -->
      <div id="sv-user-chip" style="display:none;align-items:center;gap:8px;">
        <a href="/profile" id="sv-user-name" style="font-family:var(--font-mono);font-size:11px;letter-spacing:1px;color:var(--gold);text-transform:uppercase;text-decoration:none;"></a>
      </div>
      <a href="/" class="btn-primary" id="sv-login-btn" style="display:none;">Sign In</a>
    </div>
  </nav>

  <div class="profile-page">
    <div class="profile-container">

      <div id="profile-loading">Loading&hellip;</div>

      <div id="profile-unauthenticated" style="display:none;">
        <p style="color:var(--text-dim);font-family:var(--font-mono);font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:24px;">You are not signed in.</p>
        <a href="/" class="btn-primary">Go to Home</a>
      </div>

      <div id="profile-content" style="display:none;">
        <p class="profile-eyebrow">Account</p>
        <h1 class="profile-title">My Profile</h1>
        <p class="profile-subtitle">Your details are pre-filled when requesting quotations.</p>

        <div class="profile-card">
          <div class="profile-field">
            <label class="profile-label" for="prof-name">Full Name</label>
            <input class="profile-input" id="prof-name" type="text" placeholder="Your name" autocomplete="name" />
          </div>
          <div class="profile-field">
            <label class="profile-label" for="prof-email">Email Address</label>
            <input class="profile-input" id="prof-email" type="email" readonly />
            <p class="profile-hint">Email is set by your Google account and cannot be changed here.</p>
          </div>
          <div class="profile-field">
            <label class="profile-label" for="prof-phone">Phone Number</label>
            <input class="profile-input" id="prof-phone" type="tel" placeholder="+91 98765 43210" autocomplete="tel" />
          </div>
        </div>

        <button class="profile-save-btn" onclick="saveProfile()">Save Changes</button>
        <p id="profile-status" class="profile-status"></p>
        <br/>
        <button class="profile-signout" onclick="handleSignOut()">Sign out</button>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script>
    var _session = null;

    function showStatus(msg, type) {
      var el = document.getElementById('profile-status');
      el.textContent = msg;
      el.className = 'profile-status ' + type;
    }

    function loadProfile(session) {
      _session = session;
      document.getElementById('profile-loading').style.display = 'none';
      document.getElementById('profile-content').style.display = 'block';

      // Pre-fill from session
      var nameEl = document.getElementById('prof-name');
      var emailEl = document.getElementById('prof-email');
      var phoneEl = document.getElementById('prof-phone');

      if (emailEl) emailEl.value = session.user.email || '';
      if (nameEl) nameEl.value = session.user.user_metadata && session.user.user_metadata.full_name
        ? session.user.user_metadata.full_name : '';

      // Load saved profile from DB
      getClient().from('profiles').select('full_name, phone')
        .eq('id', session.user.id).single().then(function(res) {
          if (res.data) {
            if (nameEl && res.data.full_name) nameEl.value = res.data.full_name;
            if (phoneEl && res.data.phone) phoneEl.value = res.data.phone;
          }
        });
    }

    function saveProfile() {
      if (!_session) return;
      var nameEl = document.getElementById('prof-name');
      var phoneEl = document.getElementById('prof-phone');
      var btn = document.querySelector('.profile-save-btn');
      btn.disabled = true;
      showStatus('Saving…', '');
      getClient().from('profiles').upsert({
        id: _session.user.id,
        full_name: nameEl ? nameEl.value.trim() : '',
        email: _session.user.email || '',
        phone: phoneEl ? phoneEl.value.trim() : '',
        updated_at: new Date().toISOString()
      }, { onConflict: 'id' }).then(function(res) {
        btn.disabled = false;
        if (res.error) {
          showStatus('Error: ' + res.error.message, 'error');
        } else {
          showStatus('Profile saved.', 'success');
          setTimeout(function() { showStatus('', ''); }, 3000);
        }
      });
    }

    function handleSignOut() {
      signOut().then(function() {
        window.location.href = '/';
      });
    }

    // Wait for auth
    (function waitForAuth() {
      if (typeof getSession !== 'function') {
        setTimeout(waitForAuth, 80);
        return;
      }
      getSession(function(session) {
        if (session) {
          loadProfile(session);
        } else {
          document.getElementById('profile-loading').style.display = 'none';
          document.getElementById('profile-unauthenticated').style.display = 'block';
        }
      });
    })();
  </script>
</body>
</html>
